crowd:
  ros__parameters:
    use_sim_time: true
    update_frequency: 20.0
    num_agents: 15

    # spawn region (crowd.spawn_*)
    crowd:
      spawn_left_right: true
      spawn_top_bottom: true 
      spawn_x_min: -5.0
      spawn_x_max: 5.0
      spawn_y_min: -5.0
      spawn_y_max: 5.0

    # social force model (sfm.*)
    sfm:
      person_radius: 0.2
      person_height: 1.
      avoid_radius: 0.65
      anisotropy: 0.2
      sidestep: 0.3
      sidestep_cone: 0.6
      sidestep_lat_scale: 0.3
      sidestep_bias: 1.0
      repel_strength: 0.75
      repel_strength_falloff: 0.4
      preferred_walk_speed: 1.3
      min_walk_speed: 0.15
      max_walk_speed: 1.6
      relaxation_time: 0.4
