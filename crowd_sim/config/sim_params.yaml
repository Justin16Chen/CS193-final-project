crowd:
  ros__parameters:
    use_sim_time: true
    update_frequency: 20.0
    num_agents: 40

    # spawn region (crowd.spawn_*)
    crowd:
      spawn_x_min: -10.0
      spawn_x_max: 10.0
      spawn_y_min: -10.0
      spawn_y_max: 10.0

    # social force model (sfm.*)
    sfm:
      avoid_radius: 0.75
      anisotropy: 0.5
      repel_strength: 0.45
      repel_strength_falloff: 0.45
      preferred_walk_speed: 1.3
      max_walk_speed: 1.6
      relaxation_time: 0.9
