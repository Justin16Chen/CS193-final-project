crowd:
  ros__parameters:
    use_sim_time: true
    update_frequency: 20.0
    num_agents: 10

    # spawn region (crowd.spawn_*)
    crowd:
      spawn_x_min: -5.0
      spawn_x_max: 5.0
      spawn_y_min: -5.0
      spawn_y_max: 5.0

    # social force model (sfm.*)
    sfm:
      person_radius: 0.2
      person_height: 1.
      avoid_radius: 0.65
      anisotropy: 0.5
      repel_strength: 0.75
      repel_strength_falloff: 0.4
      preferred_walk_speed: 1.3
      max_walk_speed: 1.6
      relaxation_time: 0.7
