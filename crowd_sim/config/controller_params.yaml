controller:
  ros__parameters:
    start_x: -5.5
    start_y: 0.
    start_yaw: 0.

    est_params:
      max_dist_diff: 3.5
      agent_width: 0.4
      max_position_dist_diff: 0.15

    smooth_params:
      # number of past velocity estimates kept for smoothing
      num_prev_vels: 13
      # one weight per past estimate, oldest first, newest last; must have num_prev_vels entries
      weights: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.1, 0.1, 0.1, 0.15, 0.15]
