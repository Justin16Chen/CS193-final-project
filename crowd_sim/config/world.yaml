# Gazebo world geometry, read by sim.launch.py to fill gazebo_sim/sim_world.sdf.template.
# This is NOT a ROS params file: rcl rejects any top-level key without ros__parameters,
# so it must stay separate from sim_params.yaml.
world:
  initial_robot_position: [-5.5, 0.]
  initial_robot_yaw: 0
  x_min: -15.0
  x_max: 15.0
  y_min: -15.0
  y_max: 15.0
  wall_thickness: 0.2
  wall_height: 3.0
  build_test_person: false
